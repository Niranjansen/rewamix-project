# Render Blueprint — deploys the whole project (1 API + 2 websites) in one go.
# Dashboard -> New -> Blueprint -> select this repo.
services:
  # ---------- ONE backend for both customer site and admin panel ----------
  - type: web
    name: rewamix-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI          # MongoDB Atlas connection string
        sync: false
      - key: JWT_SECRET         # auto-generated by Render
        generateValue: true
      - key: ALLOWED_ORIGINS    # both frontend URLs, comma separated
        sync: false
      - key: ADMIN_EMAIL        # first admin login
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Admin

  # ---------- Customer website ----------
  - type: web
    name: rewamix-store
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL       # https://<rewamix-api>.onrender.com/api
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------- Admin panel website ----------
  - type: web
    name: rewamix-admin
    runtime: static
    rootDir: admin/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL       # https://<rewamix-api>.onrender.com/api/admin
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
